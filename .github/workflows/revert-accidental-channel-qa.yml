name: Revert accidental Channel QA edit

on:
  push:
    paths:
      - '.github/workflows/revert-accidental-channel-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore pre-QA development state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/processor.cpp')
          s = p.read_text(encoding='utf-8')
          old = '    processing_ = shouldProcess;\n    return kResultOk;'
          new = '    processing_ = shouldProcess;\n    return AudioEffect::setProcessing(state);'
          if old not in s:
              raise SystemExit('Expected accidental QA fix not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          c = Path('CMakeLists.txt')
          s = c.read_text(encoding='utf-8')
          old = 'project(SaturatorMixFX VERSION 0.1.1 LANGUAGES CXX)'
          new = 'project(SaturatorMixFX VERSION 0.1.0 LANGUAGES CXX)'
          if old not in s:
              raise SystemExit('Expected accidental version bump not found')
          c.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit restored development state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/processor.cpp CMakeLists.txt
          git commit -m "Revert accidental Channel QA edit from development main"
          git push
