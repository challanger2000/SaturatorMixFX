name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk"
          -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        run: cmake --build build --config Release --target SMX-3-MixFX

      - name: Build VST3 Validator
        run: cmake --build build --config Release --target validator

      - name: Prepare standard-category validator build
        shell: pwsh
        run: |
          $factoryPath = "source/factory.cpp"
          $factory = Get-Content $factoryPath -Raw
          if (-not $factory.Contains('"Audio Mix Processor"')) {
            throw "Mix FX factory category not found; refusing to create validator-only build"
          }
          $factory = $factory.Replace('"Audio Mix Processor"', 'kVstAudioEffectClass')
          Set-Content -Path $factoryPath -Value $factory -Encoding utf8

          cmake -S . -B build-validator `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk" `
            -DSMTG_CREATE_PLUGIN_LINK=0

          cmake --build build-validator --config Release --target SMX-3-MixFX

      - name: Run VST3 Validator against standard-category test build
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path build -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) {
            throw "validator.exe not found after validator target build"
          }

          $plugin = Get-ChildItem -Path build-validator -Recurse -Directory -Filter SMX-3-MixFX.vst3 | Select-Object -First 1
          if (-not $plugin) {
            throw "validator-only SMX-3-MixFX.vst3 not found"
          }

          Write-Host "Validator: $($validator.FullName)"
          Write-Host "Test plugin: $($plugin.FullName)"
          Write-Host "NOTE: Test build differs only in factory category; production Mix FX artifact remains unchanged."

          & $validator.FullName $plugin.FullName 2>&1 | Tee-Object -FilePath validator.log
          $validatorExit = $LASTEXITCODE

          $log = Get-Content validator.log -Raw
          if ($log -match 'Result:\s+0 tests passed,\s+0 tests failed') {
            Write-Error "Validator created zero plugin tests; lifecycle/state validation did not actually run."
            exit 2
          }

          if ($validatorExit -ne 0) {
            exit $validatorExit
          }

      - name: Upload Validator Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SMX-3-MixFX-Validator-Log
          path: validator.log
          if-no-files-found: warn

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SMX-3-MixFX-Windows-x64
          path: build/**/*.vst3
          if-no-files-found: error
