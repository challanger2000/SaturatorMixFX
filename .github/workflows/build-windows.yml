name: Build Windows VST3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Steinberg VST3 SDK
        uses: actions/checkout@v4
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          path: vst3sdk
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DVST3_SDK_ROOT="$env:GITHUB_WORKSPACE/vst3sdk"
          -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Release
        run: cmake --build build --config Release --target SaturatorMixFX

      - name: Build VST3 Validator
        run: cmake --build build --config Release --target validator

      - name: Run VST3 Validator
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path build -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) {
            throw "validator.exe not found after validator target build"
          }

          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter SaturatorMixFX.vst3 | Select-Object -First 1
          if (-not $plugin) {
            throw "SaturatorMixFX.vst3 not found after plugin build"
          }

          Write-Host "Validator: $($validator.FullName)"
          Write-Host "Plugin:    $($plugin.FullName)"

          & $validator.FullName $plugin.FullName 2>&1 | Tee-Object -FilePath validator.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Validator Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SaturatorMixFX-Validator-Log
          path: validator.log
          if-no-files-found: warn

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SaturatorMixFX-Windows-x64
          path: build/**/*.vst3
          if-no-files-found: error
